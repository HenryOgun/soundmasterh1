name: Deploy to Whogohost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/henryogun-professional-blog2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: code/henryogun-professional-blog2
      - name: Build
        run: npm run build
        working-directory: code/henryogun-professional-blog2
      - name: Deploy to Whogohost via FTP
        run: |
          sudo apt-get install -y lftp
          lftp -c "
            set ftp:ssl-allow no;
            set net:timeout 10;
            set net:max-retries 3;
            open -u ${{ secrets.FTP_USERNAME }},${{ secrets.FTP_PASSWORD }} ${{ secrets.FTP_SERVER }};
            mirror --reverse --delete --verbose --no-perms code/henryogun-professional-blog2/dist/ public_html/
          "
