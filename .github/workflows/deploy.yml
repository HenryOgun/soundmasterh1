name: Deploy to Whogohost

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/henryogun-professional-blog2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: code/henryogun-professional-blog2
      - name: Build
        run: npm run build
        working-directory: code/henryogun-professional-blog2
      - name: Deploy to Whogohost via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: code/henryogun-professional-blog2/dist/
          server-dir: public_html/
