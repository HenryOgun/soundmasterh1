name: Deploy to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: code/henryogun-professional-blog2/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: code/henryogun-professional-blog2
      - name: Build
        run: npm run build
        working-directory: code/henryogun-professional-blog2
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: code/henryogun-professional-blog2/dist
      - id: deployment
        uses: actions/deploy-pages@v4
